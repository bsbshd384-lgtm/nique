<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Unique</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>

<style>
*{box-sizing:border-box}
:root{
 --bg:#090909;--card:#151515;--card2:#202020;
 --text:#fff;--muted:#999;--line:#292929;
 --red:#ff0033;--blue:#0095f6;--green:#25d366
}
html,body{
 margin:0;background:#000;color:var(--text);
 font-family:Arial,Helvetica,sans-serif
}
body{min-height:100vh}
button,input,textarea{font:inherit}
button{border:0;background:none;color:#fff;cursor:pointer}
.app{
 max-width:700px;margin:auto;min-height:100vh;
 background:var(--bg);padding-bottom:78px
}
.top{
 height:60px;display:flex;align-items:center;gap:8px;
 padding:0 10px;position:sticky;top:0;z-index:30;
 background:rgba(9,9,9,.97);backdrop-filter:blur(12px);
 border-bottom:1px solid #181818
}
.logo{display:flex;align-items:center;gap:8px;margin-right:auto}
.logoIcon{
 width:39px;height:39px;border-radius:12px;
 background:linear-gradient(135deg,#fff 0 43%,#ff0033 44% 100%);
 position:relative;display:grid;place-items:center;
 box-shadow:0 0 18px #ff003355
}
.logoIcon:after{
 content:"▶";font-size:17px;color:#ff0033;
 background:#080808;width:22px;height:22px;
 border-radius:7px;display:grid;place-items:center;
 padding-left:2px
}
.logoText{font-size:21px;font-weight:900;letter-spacing:-1px}
.logoText b{color:var(--red)}
.topBtn{
 width:40px;height:40px;border-radius:50%;
 display:grid;place-items:center
}
.topBtn:active{background:#222}
.svg{
 width:23px;height:23px;fill:none;
 stroke:currentColor;stroke-width:2;
 stroke-linecap:round;stroke-linejoin:round
}
.searchBox{
 display:none;flex:1;height:40px;background:#202020;
 border-radius:22px;padding:0 13px;align-items:center
}
.searchBox input{
 width:100%;background:none;border:0;outline:0;color:#fff
}
.screen{display:none}
.screen.active{display:block}

.chips{
 display:flex;gap:8px;overflow:auto;padding:10px 12px;
 scrollbar-width:none
}
.chips::-webkit-scrollbar{display:none}
.chip{
 background:#252525;padding:8px 15px;border-radius:20px;
 white-space:nowrap;font-size:13px
}
.chip.active{background:#fff;color:#000}

.videoCard{
 padding-bottom:14px;margin-bottom:10px;
 border-bottom:1px solid #222
}
.thumb{
 width:100%;aspect-ratio:16/9;background:#222;
 position:relative;overflow:hidden
}
.thumb img{width:100%;height:100%;object-fit:cover}
.fakeThumb{
 width:100%;height:100%;
 background:linear-gradient(135deg,#151b30,#6b3045,#111);
 display:grid;place-items:center
}
.play{
 width:62px;height:62px;border-radius:50%;
 background:#000b;display:grid;place-items:center;
 font-size:25px
}
.duration{
 position:absolute;right:8px;bottom:8px;
 background:#000d;padding:4px 6px;border-radius:4px;
 font-size:11px
}
.videoInfo{
 display:flex;gap:10px;padding:10px 12px 0
}
.avatar{
 width:40px;height:40px;flex:none;border-radius:50%;
 display:grid;place-items:center;font-weight:800;
 background:linear-gradient(135deg,#ff0033,#703cff)
}
.meta{min-width:0;flex:1}
.title{font-size:16px;font-weight:700;line-height:1.35}
.sub{font-size:12px;color:#999;margin-top:5px}
.more{font-size:23px}
.actionRow{
 display:flex;gap:7px;overflow:auto;padding:9px 12px 0
}
.action{
 background:#242424;border-radius:20px;
 padding:8px 13px;white-space:nowrap;font-size:12px
}
.action.on{color:#ff355b}

.bottom{
 position:fixed;bottom:0;left:50%;
 transform:translateX(-50%);
 width:min(700px,100%);height:76px;
 background:#090909;border-top:1px solid #292929;
 display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;
 z-index:60
}
.nav{
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 gap:4px;color:#999;font-size:10px
}
.nav.active{color:#fff}
.create{
 width:54px;height:54px;border-radius:50%;
 background:#222;margin-top:-7px;
 display:grid;place-items:center
}
.create .svg{width:33px;height:33px}

.pageTitle{
 font-size:22px;font-weight:800;padding:17px 14px 8px
}
.row{
 display:flex;align-items:center;gap:12px;
 padding:13px 14px;border-bottom:1px solid #222
}
.rowText{flex:1;min-width:0}
.rowTitle{font-weight:700}
.rowSub{font-size:12px;color:#888;margin-top:4px}
.empty{text-align:center;color:#888;padding:55px 20px}

.inbox,.chat{
 position:fixed;inset:0;background:#0b0b0b;
 z-index:100;display:none
}
.inbox.open,.chat.open{display:flex;flex-direction:column}
.inboxHead,.chatHead{
 height:60px;display:flex;align-items:center;
 gap:8px;padding:0 10px;border-bottom:1px solid #252525
}
.headTitle{font-size:20px;font-weight:800;flex:1}
.backBtn{width:40px;height:40px;font-size:27px}
.inboxSearch{
 margin:10px 14px;height:40px;background:#202020;
 border-radius:10px;padding:0 12px;display:flex;
 align-items:center
}
.inboxSearch input{
 width:100%;border:0;outline:0;background:none;color:#fff
}
.notes{
 display:flex;gap:16px;overflow:auto;padding:8px 14px 15px
}
.note{min-width:60px;text-align:center;color:#999;font-size:11px}
.note .avatar{margin:auto}
.userList{overflow:auto}
.online{
 width:9px;height:9px;background:#25d366;
 border-radius:50%
}

.chatBody{flex:1;overflow:auto;padding:14px}
.bubble{
 max-width:78%;padding:10px 13px;border-radius:17px;
 margin:7px 0;font-size:14px
}
.mine{background:#ff0033;margin-left:auto}
.theirs{background:#252525}
.chatSend{
 display:flex;gap:7px;padding:9px;
 border-top:1px solid #292929
}
.chatSend input{
 flex:1;background:#202020;border:0;
 outline:0;color:#fff;border-radius:22px;padding:11px 14px
}
.sendBtn{background:#ff0033;border-radius:22px;padding:0 16px}

.modal{
 position:fixed;inset:0;background:#000d;
 z-index:150;display:none;
 align-items:center;justify-content:center;padding:15px
}
.modal.open{display:flex}
.modalCard{
 width:min(620px,100%);max-height:92vh;
 overflow:auto;background:#151515;border-radius:16px
}
.modalHead{
 display:flex;align-items:center;
 padding:13px;border-bottom:1px solid #292929
}
.modalHead b{flex:1}
.close{font-size:25px}

.player{
 width:100%;aspect-ratio:16/9;background:#000;
 display:grid;place-items:center
}
.player video{width:100%;height:100%;object-fit:contain}
.playerFake{
 width:100%;height:100%;
 background:linear-gradient(135deg,#1a2037,#63394b);
 display:grid;place-items:center;font-size:45px
}
.playerInfo{padding:12px}
.playerInfo h3{margin:0}
.comments{max-height:250px;overflow:auto;padding:0 12px}
.comment{padding:9px 0;border-bottom:1px solid #252525}
.comment p{margin:5px 0;color:#ddd;font-size:13px}
.commentInput{
 display:flex;gap:7px;padding:10px
}
.commentInput input{
 flex:1;background:#222;border:0;
 outline:0;color:#fff;border-radius:22px;padding:10px
}

.form{padding:15px}
.form input,.form textarea,.form select{
 width:100%;background:#202020;color:#fff;
 border:1px solid #333;border-radius:9px;
 padding:12px;margin:6px 0;outline:0
}
.form textarea{min-height:100px;resize:none}
.primary{
 width:100%;background:#ff0033;
 padding:12px;border-radius:9px;
 font-weight:800;margin-top:8px
}
.secondary{
 background:#292929;padding:11px 15px;border-radius:8px
}
.progress{
 height:5px;background:#333;margin-top:10px;display:none
}
.progress i{display:block;height:100%;width:0;background:#ff0033}

.createMenu{
 position:fixed;inset:0;background:#000b;
 z-index:140;display:none;align-items:flex-end
}
.createMenu.open{display:flex}
.sheet{
 width:100%;background:#171717;
 border-radius:20px 20px 0 0;padding:20px
}
.sheet h3{margin:0 0 10px}
.option{
 display:flex;align-items:center;gap:14px;
 padding:15px 4px;border-bottom:1px solid #292929
}
.optionIcon{
 width:43px;height:43px;border-radius:50%;
 background:#292929;display:grid;place-items:center
}

.shortFeed{background:#000}
.short{
 height:calc(100vh - 76px);
 min-height:560px;position:relative;
 overflow:hidden;background:#151515
}
.shortBg{width:100%;height:100%;object-fit:cover}
.shortOverlay{
 position:absolute;inset:0;
 background:linear-gradient(transparent 45%,#000d)
}
.shortText{
 position:absolute;left:14px;right:80px;bottom:30px
}
.shortText b{font-size:18px}
.shortText p{font-size:13px}
.shortActions{
 position:absolute;right:10px;bottom:25px;
 display:flex;flex-direction:column;gap:20px
}
.shortAct{text-align:center;font-size:11px}
.shortAct .svg{display:block;margin:auto;width:29px;height:29px}

.profileHead{padding:25px 17px;border-bottom:1px solid #222}
.profileBig{
 width:85px;height:85px;border-radius:50%;
 background:linear-gradient(135deg,#ff0033,#703cff);
 display:grid;place-items:center;font-size:30px;font-weight:800
}
.profileName{font-size:23px;font-weight:800;margin-top:12px}
.profileId{font-size:11px;color:#777;margin-top:5px}
.profileBtns{display:flex;gap:8px;margin-top:15px}
.profileBtns button{
 flex:1;background:#252525;padding:10px;border-radius:8px
}

.setting{
 display:flex;align-items:center;padding:15px;
 border-bottom:1px solid #222
}
.settingText{flex:1}
.settingText b{display:block}
.settingText span{color:#888;font-size:12px}
.switch{
 width:45px;height:25px;background:#444;
 border-radius:20px;padding:3px
}
.switch i{
 display:block;width:19px;height:19px;
 background:#fff;border-radius:50%
}
.switch.on{background:#ff0033}
.switch.on i{margin-left:20px}

.loginGate{
 position:fixed;inset:0;background:#000;
 z-index:999;display:flex;
 align-items:center;justify-content:center;padding:18px
}
.loginGate.hide{display:none}
.loginCard{
 width:min(380px,100%);
 border:1px solid #292929;
 background:#101010;border-radius:16px;
 padding:25px;text-align:center
}
.loginLogo{
 width:90px;height:90px;border-radius:24px;
 margin:0 auto 15px;
 background:linear-gradient(135deg,#fff 0 43%,#ff0033 44%);
 display:grid;place-items:center;
 box-shadow:0 0 30px #ff003344
}
.loginLogo:after{
 content:"▶";font-size:31px;color:#ff0033;
 background:#050505;width:42px;height:42px;
 border-radius:13px;display:grid;place-items:center;
 padding-left:4px
}
.loginBrand{font-size:31px;font-weight:900}
.loginBrand b{color:#ff0033}
.loginTitle{color:#999;font-size:13px;margin:7px 0 18px}
.loginCard input{
 width:100%;height:45px;
 background:#1d1d1d;border:1px solid #333;
 color:#fff;border-radius:8px;
 padding:0 12px;margin:5px 0;outline:0
}
.loginBtn{
 width:100%;height:45px;
 background:#ff0033;border-radius:8px;
 margin-top:9px;font-weight:800
}
.loginSwitch{margin-top:18px;color:#999;font-size:13px}
.loginSwitch button{color:#0095f6;font-weight:800}
.loginMsg{font-size:12px;color:#ff667d;min-height:20px;margin-top:8px}
.forgot{font-size:12px;color:#aaa;margin-top:13px}

.callScreen{
 position:fixed;inset:0;background:#050505;
 z-index:300;display:none
}
.callScreen.open{display:block}
.remoteVideo{
 width:100%;height:100%;object-fit:cover;
 background:linear-gradient(135deg,#171717,#252525)
}
.localVideo{
 position:absolute;right:15px;top:65px;
 width:115px;height:165px;
 background:#222;border-radius:12px;
 object-fit:cover
}
.callName{
 position:absolute;top:25px;left:0;right:0;
 text-align:center;font-weight:800;font-size:18px
}
.callControls{
 position:absolute;bottom:35px;left:0;right:0;
 display:flex;justify-content:center;gap:16px
}
.callBtn{
 width:58px;height:58px;border-radius:50%;
 background:#292929;display:grid;place-items:center;
 font-size:22px
}
.callBtn.red{background:#ff0033}
.incoming{
 position:fixed;inset:0;background:#000d;
 z-index:310;display:none;
 align-items:center;justify-content:center
}
.incoming.open{display:flex}
.incomingCard{
 width:min(340px,90%);background:#171717;
 border-radius:20px;padding:28px;text-align:center
}
.incomingAvatar{
 width:80px;height:80px;border-radius:50%;
 background:linear-gradient(135deg,#ff0033,#703cff);
 display:grid;place-items:center;
 font-size:28px;font-weight:800;margin:auto
}
.incomingBtns{display:flex;gap:20px;justify-content:center;margin-top:25px}
.incomingBtns button{
 width:58px;height:58px;border-radius:50%;
 background:#25d366;font-size:22px
}
.incomingBtns .reject{background:#ff0033}

.toast{
 position:fixed;left:50%;bottom:90px;
 transform:translateX(-50%);
 background:#fff;color:#111;
 padding:10px 15px;border-radius:9px;
 z-index:500;display:none;font-size:13px
}
.toast.show{display:block}

@media(max-width:400px){
 .logoText{font-size:18px}
 .topBtn{width:36px}
 .title{font-size:15px}
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div class="loginGate" id="loginGate">
 <div class="loginCard">

  <div class="loginLogo"></div>

  <div class="loginBrand">Uni<b>que</b></div>

  <div class="loginTitle" id="loginTitle">
   ভিডিও, Shorts আর বন্ধুদের সাথে Unique-এ যুক্ত থাকুন
  </div>

  <input id="authName" placeholder="আপনার নাম" style="display:none">
  <input id="authEmail" type="email" placeholder="Email">
  <input id="authPassword" type="password" placeholder="Password">

  <button class="loginBtn" id="authBtn" onclick="submitAuth()">
   Log in
  </button>

  <div class="forgot" onclick="forgotPassword()">
   Password ভুলে গেছেন?
  </div>

  <div class="loginMsg" id="authMsg"></div>

  <div class="loginSwitch">
   <span id="switchText">Don't have an account?</span>
   <button onclick="toggleAuth()" id="switchBtn">Sign up</button>
  </div>

 </div>
</div>

<div class="app">

<!-- ================= TOP ================= -->
<header class="top">

 <div class="logo">
  <div class="logoIcon"></div>
  <div class="logoText">Uni<b>que</b></div>
 </div>

 <div class="searchBox" id="searchBox">
  <input id="searchInput" placeholder="Search videos, channels...">
 </div>

 <button class="topBtn" onclick="toggleSearch()">
  <svg class="svg" viewBox="0 0 24 24">
   <circle cx="11" cy="11" r="7"/>
   <path d="m20 20-4-4"/>
  </svg>
 </button>

 <button class="topBtn" onclick="openInbox()">
  <svg class="svg" viewBox="0 0 24 24">
   <path d="M4 5h16v14H4z"/>
   <path d="m4 6 8 6 8-6"/>
  </svg>
 </button>

 <button class="topBtn" onclick="openNotifications()">
  <svg class="svg" viewBox="0 0 24 24">
   <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
   <path d="M10 21h4"/>
  </svg>
 </button>

</header>

<!-- ================= HOME ================= -->
<section class="screen active" id="home">

 <div class="chips">
  <button class="chip active" onclick="filterVideos('All',this)">All</button>
  <button class="chip" onclick="filterVideos('Music',this)">Music</button>
  <button class="chip" onclick="filterVideos('Gaming',this)">Gaming</button>
  <button class="chip" onclick="filterVideos('News',this)">News</button>
  <button class="chip" onclick="filterVideos('Education',this)">Education</button>
  <button class="chip" onclick="filterVideos('Sports',this)">Sports</button>
  <button class="chip" onclick="filterVideos('Travel',this)">Travel</button>
 </div>

 <div id="videoFeed"></div>

</section>

<!-- ================= SHORTS ================= -->
<section class="screen shortFeed" id="shorts">
 <div class="short" id="shortBox">
  <div class="fakeThumb" style="height:100%">
   <div class="play">▶</div>
  </div>

  <div class="shortOverlay"></div>

  <div class="shortText">
   <b id="shortTitle">Unique Shorts 🔥</b>
   <p id="shortDesc">Welcome to Unique — Watch, Share & Connect</p>
   <span>#Unique #Shorts #Bangladesh</span>
  </div>

  <div class="shortActions">
   <button class="shortAct" onclick="shortLike(this)">
    <svg class="svg"><use href="#heart"/></svg>
    <span>Like</span>
   </button>
   <button class="shortAct" onclick="showToast('Comments')">
    <svg class="svg"><use href="#comment"/></svg>
    <span>Comments</span>
   </button>
   <button class="shortAct" onclick="shareText('Unique Shorts')">
    <svg class="svg"><use href="#share"/></svg>
    <span>Share</span>
   </button>
   <button class="shortAct" onclick="showToast('Saved')">
    <svg class="svg"><use href="#save"/></svg>
    <span>Save</span>
   </button>
  </div>
 </div>
</section>

<!-- ================= SUBSCRIPTIONS ================= -->
<section class="screen" id="subscriptions">
 <div class="pageTitle">Subscriptions</div>
 <div id="subscriptionList"></div>
</section>

<!-- ================= YOU ================= -->
<section class="screen" id="you">

 <div class="profileHead">
  <div class="profileBig" id="profileAvatar">U</div>
  <div class="profileName" id="profileName">Unique User</div>
  <div class="profileId" id="profileId">ID: loading...</div>

  <div class="profileBtns">
   <button onclick="openMyVideos()">Your videos</button>
   <button onclick="openSettings()">Settings</button>
  </div>
 </div>

 <div class="row" onclick="openHistory()">
  <div>🕘</div>
  <div class="rowText">
   <div class="rowTitle">History</div>
   <div class="rowSub">আপনি যে ভিডিওগুলো দেখেছেন</div>
  </div>
  <div>›</div>
 </div>

 <div class="row" onclick="openPlaylists()">
  <div>📚</div>
  <div class="rowText">
   <div class="rowTitle">Playlists</div>
   <div class="rowSub">Saved videos & playlists</div>
  </div>
  <div>›</div>
 </div>

 <div class="row" onclick="openNotifications()">
  <div>🔔</div>
  <div class="rowText">
   <div class="rowTitle">Notifications</div>
   <div class="rowSub">Likes, comments & subscriptions</div>
  </div>
  <div>›</div>
 </div>

 <div class="row" onclick="openAI()">
  <div>🤖</div>
  <div class="rowText">
   <div class="rowTitle">Unique AI</div>
   <div class="rowSub">Video ideas, titles, hashtags</div>
  </div>
  <div>›</div>
 </div>

 <div class="row" onclick="logout()">
  <div>🚪</div>
  <div class="rowText">
   <div class="rowTitle">Log out</div>
  </div>
 </div>

</section>

<!-- ================= BOTTOM ================= -->
<nav class="bottom">

 <button class="nav active" onclick="go('home',this)">
  <svg class="svg"><use href="#homeIcon"/></svg>
  <span>Home</span>
 </button>

 <button class="nav" onclick="go('shorts',this)">
  <svg class="svg"><use href="#shortIcon"/></svg>
  <span>Shorts</span>
 </button>

 <button class="nav" onclick="openCreate()">
  <div class="create">
   <svg class="svg"><use href="#plus"/></svg>
  </div>
 </button>

 <button class="nav" onclick="go('subscriptions',this);loadSubscriptions()">
  <svg class="svg"><use href="#subIcon"/></svg>
  <span>Subscriptions</span>
 </button>

 <button class="nav" onclick="go('you',this)">
  <svg class="svg"><use href="#userIcon"/></svg>
  <span>You</span>
 </button>

</nav>

</div>

<!-- ================= INBOX ================= -->
<div class="inbox" id="inbox">

 <div class="inboxHead">
  <button class="backBtn" onclick="closeInbox()">‹</button>
  <div class="headTitle">Messages</div>

  <button onclick="showToast('New message')">＋</button>
 </div>

 <div class="inboxSearch">
  🔎
  <input id="userSearch" placeholder="Search people..."
   oninput="renderUsers()">
 </div>

 <div class="notes">
  <div class="note">
   <div class="avatar">+</div>
   Add note
  </div>
  <div class="note">
   <div class="avatar">U</div>
   Your note
  </div>
 </div>

 <div class="pageTitle" style="font-size:16px">
  Messages
 </div>

 <div class="userList" id="userList"></div>

</div>

<!-- ================= CHAT ================= -->
<div class="chat" id="chat">

 <div class="chatHead">
  <button class="backBtn" onclick="closeChat()">‹</button>
  <div class="avatar" id="chatAvatar">U</div>
  <div class="headTitle" id="chatName">User</div>

  <button class="topBtn" onclick="startCall('audio')">☎</button>
  <button class="topBtn" onclick="startCall('video')">▣</button>
 </div>

 <div class="chatBody" id="chatBody"></div>

 <div class="chatSend">
  <input id="messageInput" placeholder="Message..."
   onkeydown="if(event.key==='Enter')sendMessage()">
  <button class="sendBtn" onclick="sendMessage()">Send</button>
 </div>

</div>

<!-- ================= VIDEO MODAL ================= -->
<div class="modal" id="videoModal">
 <div class="modalCard">

  <div class="modalHead">
   <b id="playerTitle">Video</b>
   <button class="close" onclick="closeVideo()">×</button>
  </div>

