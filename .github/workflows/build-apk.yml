name: Build Unique APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check index.html
        run: |
          test -f index.html
          echo "index.html found successfully"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |

          mkdir -p app/src/main/java/com/unique/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          cp index.html app/src/main/assets/index.html

          # =========================
          # SETTINGS
          # =========================

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Unique"

          include(":app")
          EOF

          # =========================
          # PROJECT GRADLE
          # =========================

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
          }
          EOF

          # =========================
          # GRADLE PROPERTIES
          # =========================

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          # =========================
          # APP GRADLE
          # =========================

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.unique.app'

              compileSdk 36

              defaultConfig {

                  applicationId "com.unique.app"

                  minSdk 23

                  targetSdk 36

                  versionCode 1

                  versionName "1.0"
              }

              buildTypes {

                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
          }
          EOF

          # =========================
          # COLORS
          # =========================

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <color name="unique_black">
                  #050508
              </color>

          </resources>
          EOF

          # =========================
          # APP THEME
          # =========================

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #FF0080
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

                  <item name="android:statusBarColor">
                      #050508
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:windowActionModeOverlay">
                      true
                  </item>

              </style>

          </resources>
          EOF

          # =========================
          # UNIQUE OUTSIDE APP LOGO
          # =========================

          cat > app/src/main/res/drawable/ic_unique_logo.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="512"
              android:viewportHeight="512">

              <!-- BLACK BACKGROUND -->

              <path
                  android:fillColor="#050508"
                  android:pathData="
                  M110,0
                  L402,0
                  Q512,0 512,110
                  L512,402
                  Q512,512 402,512
                  L110,512
                  Q0,512 0,402
                  L0,110
                  Q0,0 110,0
                  Z" />

              <!-- BLUE U -->

              <path
                  android:fillColor="#00E5FF"
                  android:pathData="
                  M145,120
                  L203,120
                  L203,292
                  Q203,354 256,354
                  Q309,354 309,292
                  L309,120
                  L367,120
                  L367,295
                  Q367,412 256,412
                  Q145,412 145,295
                  Z" />

              <!-- PINK PLAY -->

              <path
                  android:fillColor="#FF0080"
                  android:pathData="
                  M350,105
                  L425,160
                  L350,215
                  Z" />

          </vector>
          EOF

          # =========================
          # ANDROID MANIFEST
          # =========================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.CAMERA" />

              <uses-permission
                  android:name="android.permission.RECORD_AUDIO" />

              <application

                  android:theme="@style/AppTheme"

                  android:label="Unique"

                  android:icon="@drawable/ic_unique_logo"

                  android:roundIcon="@drawable/ic_unique_logo"

                  android:usesCleartextTraffic="true"

                  android:hardwareAccelerated="true">

                  <activity

                      android:name=".MainActivity"

                      android:screenOrientation="portrait"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # =========================
          # MAIN ACTIVITY
          # =========================

          cat > app/src/main/java/com/unique/app/MainActivity.java <<'EOF'
          package com.unique.app;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.InputStream;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  requestPermissions(
                      new String[] {
                          Manifest.permission.CAMERA,
                          Manifest.permission.RECORD_AUDIO
                      },
                      100
                  );

                  webView = new WebView(this);

                  webView.getSettings()
                      .setJavaScriptEnabled(true);

                  webView.getSettings()
                      .setDomStorageEnabled(true);

                  webView.getSettings()
                      .setDatabaseEnabled(true);

                  webView.getSettings()
                      .setMediaPlaybackRequiresUserGesture(false);

                  webView.getSettings()
                      .setAllowFileAccess(true);

                  webView.getSettings()
                      .setAllowContentAccess(true);

                  /*
                   * Load index.html from Android assets.
                   */

                  webView.setWebViewClient(
                      new WebViewClient() {

                          @Override
                          public WebResourceResponse
                          shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                          ) {

                              String url =
                                  request.getUrl().toString();

                              if (
                                  url.startsWith(
                                      "https://appassets.androidplatform.net/"
                                  )
                              ) {

                                  try {

                                      String path =
                                          request.getUrl()
                                              .getPath();

                                      if (
                                          path == null ||
                                          path.equals("/")
                                      ) {

                                          path =
                                              "/index.html";
                                      }

                                      if (
                                          path.startsWith(
                                              "/assets/"
                                          )
                                      ) {

                                          path =
                                              path.substring(8);
                                      }

                                      InputStream input =
                                          getAssets()
                                              .open(path);

                                      return new WebResourceResponse(
                                          "text/html",
                                          "UTF-8",
                                          input
                                      );

                                  } catch (Exception e) {

                                      return null;
                                  }
                              }

                              return null;
                          }
                      }
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public void onPermissionRequest(
                              final PermissionRequest request
                          ) {

                              runOnUiThread(
                                  new Runnable() {

                                      @Override
                                      public void run() {

                                          request.grant(
                                              request
                                                  .getResources()
                                          );
                                      }
                                  }
                              );
                          }
                      }
                  );

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
          EOF

      # =========================
      # INSTALL GRADLE
      # =========================

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # =========================
      # BUILD APK
      # =========================

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      # =========================
      # BUILD AAB
      # =========================

      - name: Build AAB
        run: |
          gradle bundleRelease --no-daemon

      # =========================
      # UPLOAD APK
      # =========================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unique-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # =========================
      # UPLOAD AAB
      # =========================

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Unique-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
