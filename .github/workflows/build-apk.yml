    !name.toLowerCase().includes(q)
   )return;

   const row=document.createElement("div");

   row.className="row";

   row.onclick=()=>{
    openChat(name,id);
   };

   row.innerHTML=`

    <div class="avatar">
     ${name.charAt(0).toUpperCase()}
    </div>

    <div class="rowText">

     <div class="rowTitle">
      ${escapeHtml(name)}
     </div>

     <div class="rowSub">
      ${u.online?"Active now":"Offline"}
     </div>

    </div>

    ${
     u.online
     ?'<span class="online"></span>'
     :""
    }

   `;

   box.appendChild(row);

  });

 if(!box.children.length){

  box.innerHTML=
   '<div class="empty">অন্য Unique users এখানে দেখাবে।</div>';

 }

}


/* =====================================================
   CHAT
===================================================== */

function openChat(name,id){

 currentFriendId=id;

 document.getElementById("chatName")
  .textContent=name;

 document.getElementById("chatAvatar")
  .textContent=name.charAt(0).toUpperCase();

 document.getElementById("chat")
  .classList.add("open");

 listenMessages();
}


function closeChat(){

 document.getElementById("chat")
  .classList.remove("open");
}


function chatId(a,b){

 return[a,b].sort().join("_");

}


function listenMessages(){

 if(!uid||!currentFriendId)return;

 const ref=
  db.ref(
   "messages/"+chatId(uid,currentFriendId)
  );

 if(messageListener)
  ref.off("value",messageListener);

 messageListener=snap=>{

  const box=
   document.getElementById("chatBody");

  box.innerHTML="";

  snap.forEach(c=>{

   const m=c.val();

   const div=
    document.createElement("div");

   div.className=
    "bubble "+
    (m.uid===uid?"mine":"theirs");

   div.textContent=m.text||"";

   box.appendChild(div);

  });

  box.scrollTop=box.scrollHeight;

 };

 ref.limitToLast(100)
  .on("value",messageListener);
}


function sendMessage(){

 if(!uid||!currentFriendId)return;

 const input=
  document.getElementById("messageInput");

 const text=input.value.trim();

 if(!text)return;

 db.ref(
  "messages/"+chatId(uid,currentFriendId)
 ).push({

  uid:uid,
  text:text,
  at:firebase.database.ServerValue.TIMESTAMP

 });

 input.value="";
}


/* =====================================================
   REAL WEBRTC CALL
===================================================== */

async function startCall(type){

 if(!currentFriendId){

  showToast("আগে একজন user-এর chat খুলুন");
  return;

 }

 if(!navigator.mediaDevices){

  showToast("Camera/Mic support নেই");
  return;

 }

 try{

  localStream=
   await navigator.mediaDevices.getUserMedia({
    audio:true,
    video:type==="video"
   });

  pc=
   new RTCPeerConnection(rtcConfig);

  localStream.getTracks()
   .forEach(track=>{
    pc.addTrack(track,localStream);
   });

  document.getElementById("localVideo")
   .srcObject=localStream;

  document.getElementById("callScreen")
   .classList.add("open");

  document.getElementById("callName")
   .textContent=
    users[currentFriendId]?.name||
    "Calling...";

  currentCallId=
   uid+"_"+Date.now();

  const ref=
   db.ref("calls/"+currentCallId);

  pc.ontrack=e=>{

   document.getElementById("remoteVideo")
    .srcObject=e.streams[0];

  };

  pc.onicecandidate=e=>{

   if(e.candidate){

    ref.child("callerCandidates")
     .push(e.candidate.toJSON());

   }

  };

  const offer=
   await pc.createOffer();

  await pc.setLocalDescription(offer);

  await ref.set({

   caller:uid,
   receiver:currentFriendId,
   type:type,
   offer:{
    type:offer.type,
    sdp:offer.sdp
   },
   status:"ringing",
   createdAt:
    firebase.database.ServerValue.TIMESTAMP

  });

  ref.child("answer")
   .on("value",async snap=>{

    const answer=snap.val();

    if(
     answer &&
     pc &&
     !pc.currentRemoteDescription
    ){

     await pc.setRemoteDescription(
      new RTCSessionDescription(answer)
     );

    }

   });

  ref.child("calleeCandidates")
   .on("child_added",snap=>{

    const c=snap.val();

    if(c&&pc){

     pc.addIceCandidate(
      new RTCIceCandidate(c)
     ).catch(()=>{});

    }

   });

  showToast("Calling...");

 }catch(e){

  console.error(e);

  showToast(
   "Camera ও Microphone permission দিন"
  );

 }

}


/* =====================================================
   INCOMING CALL
===================================================== */

function listenIncomingCalls(){

 if(!uid)return;

 db.ref("calls")
  .on("child_added",snap=>{

   const call=snap.val();

   if(
    call &&
    call.receiver===uid &&
    call.status==="ringing"
   ){

    incomingCallData={
     id:snap.key,
     ...call
    };

    const caller=
     users[call.caller]||{name:"Unique User"};

    document.getElementById("incomingName")
     .textContent=caller.name;

    document.getElementById("incomingAvatar")
     .textContent=
      caller.name.charAt(0).toUpperCase();

    document.getElementById("incomingType")
     .textContent=
      call.type==="video"
      ?"Incoming video call"
      :"Incoming audio call";

    document.getElementById("incoming")
     .classList.add("open");

   }

  });

}


async function acceptIncoming(){

 if(!incomingCallData)return;

 const call=incomingCallData;

 document.getElementById("incoming")
  .classList.remove("open");

 try{

  localStream=
   await navigator.mediaDevices.getUserMedia({
    audio:true,
    video:call.type==="video"
   });

  pc=
   new RTCPeerConnection(rtcConfig);

  localStream.getTracks()
   .forEach(track=>{
    pc.addTrack(track,localStream);
   });

  document.getElementById("localVideo")
   .srcObject=localStream;

  pc.ontrack=e=>{

   document.getElementById("remoteVideo")
    .srcObject=e.streams[0];

  };

  const ref=
   db.ref("calls/"+call.id);

  pc.onicecandidate=e=>{

   if(e.candidate){

    ref.child("calleeCandidates")
     .push(e.candidate.toJSON());

   }

  };

  await pc.setRemoteDescription(
   new RTCSessionDescription(call.offer)
  );

  const answer=
   await pc.createAnswer();

  await pc.setLocalDescription(answer);

  await ref.child("answer").set({
   type:answer.type,
   sdp:answer.sdp
  });

  await ref.update({
   status:"connected"
  });

  ref.child("callerCandidates")
   .on("child_added",snap=>{

    const c=snap.val();

    if(c){

     pc.addIceCandidate(
      new RTCIceCandidate(c)
     ).catch(()=>{});

    }

   });

  document.getElementById("callName")
   .textContent=
    users[call.caller]?.name||
    "Unique User";

  document.getElementById("callScreen")
   .classList.add("open");

  currentCallId=call.id;

 }catch(e){

  console.error(e);
  showToast("Call accept হয়নি");

 }

}


async function rejectIncoming(){

 if(!incomingCallData)return;

 await db.ref(
  "calls/"+incomingCallData.id
 ).update({
  status:"rejected"
 });

 incomingCallData=null;

 document.getElementById("incoming")
  .classList.remove("open");
}


/* =====================================================
   CALL CONTROLS
===================================================== */

function toggleMute(){

 if(!localStream)return;

 const track=
  localStream.getAudioTracks()[0];

 if(track)
  track.enabled=!track.enabled;

 showToast(
  track.enabled
  ?"Microphone ON"
  :"Microphone OFF"
 );
}


function toggleCamera(){

 if(!localStream)return;

 const track=
  localStream.getVideoTracks()[0];

 if(track)
  track.enabled=!track.enabled;

 showToast(
  track.enabled
  ?"Camera ON"
  :"Camera OFF"
 );
}


async function hangupCall(){

 if(currentCallId){

  await db.ref(
   "calls/"+currentCallId
  ).update({
   status:"ended",
   endedAt:
    firebase.database.ServerValue.TIMESTAMP
  }).catch(()=>{});

 }

 if(localStream){

  localStream.getTracks()
   .forEach(t=>t.stop());

  localStream=null;
 }

 if(pc){

  pc.close();
  pc=null;

 }

 document.getElementById("remoteVideo")
  .srcObject=null;

 document.getElementById("localVideo")
  .srcObject=null;

 document.getElementById("callScreen")
  .classList.remove("open");

 currentCallId=null;
}


