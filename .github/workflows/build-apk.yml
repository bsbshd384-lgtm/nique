async function uploadVideo(){

 if(!uid){
  showToast("Login করুন");
  return;
 }

 const file=
  document.getElementById("videoFile").files[0];

 const title=
  document.getElementById("uploadTitle")
  .value.trim();

 const desc=
  document.getElementById("uploadDesc")
  .value.trim();

 const tags=
  document.getElementById("uploadTags")
  .value.trim();

 if(!file||!title){

  showToast("Video এবং title দিন");
  return;
 }

 const progress=
  document.getElementById("uploadProgress");

 const bar=progress.querySelector("i");

 progress.style.display="block";

 try{

  const path=
   "videos/"+uid+"/"+Date.now()+"_"+file.name
    .replace(/[^\w.\-]/g,"_");

  const task=
   storage.ref(path).put(file);

  task.on(
   "state_changed",

   s=>{
    bar.style.width=
     ((s.bytesTransferred/s.totalBytes)*100)+"%";
   },

   e=>{
    console.error(e);
    showToast("Upload failed");
   },

   async()=>{

    const url=
     await task.snapshot.ref.getDownloadURL();

    await db.ref("videos").push({

     uid:uid,
     title:title,
     description:desc,
     tags:tags,
     url:url,
     channel:
      document.getElementById("profileName").textContent,
     views:0,
     likes:0,
     createdAt:
      firebase.database.ServerValue.TIMESTAMP

    });

    showToast("Video uploaded ✅");

    document.getElementById("uploadTitle").value="";
    document.getElementById("uploadDesc").value="";
    document.getElementById("uploadTags").value="";
    document.getElementById("videoFile").value="";

    progress.style.display="none";
    bar.style.width="0";

    closeUpload();

    loadAllVideos();

   }
  );

 }catch(e){

  console.error(e);
  showToast("Upload failed");

 }

}


async function loadAllVideos(){

 const snap=
  await db.ref("videos")
   .limitToLast(50)
