async function submitAuth(){

 const email=document.getElementById("authEmail").value.trim();
 const pass=document.getElementById("authPassword").value;
 const name=document.getElementById("authName").value.trim();
 const msg=document.getElementById("authMsg");

 if(!email || pass.length<6 ||
   (authMode==="signup"&&!name)){

  msg.textContent=
   "সঠিক তথ্য দিন — password কমপক্ষে 6 অক্ষর";
  return;
 }

 try{

  if(authMode==="signup"){

   const cred=
    await auth.createUserWithEmailAndPassword(
     email,pass
    );

   await cred.user.updateProfile({
    displayName:name
   });

   await db.ref("users/"+cred.user.uid).set({
    uid:cred.user.uid,
    name:name,
    email:email,
    online:true,
    lastSeen:
     firebase.database.ServerValue.TIMESTAMP
   });

  }else{

   await auth.signInWithEmailAndPassword(
    email,pass
   );

  }

 }catch(e){

  const errors={
   "auth/invalid-credential":"Email বা password ভুল",
   "auth/user-not-found":"Account পাওয়া যায়নি",
   "auth/wrong-password":"Password ভুল",
   "auth/email-already-in-use":"এই email দিয়ে account আছে",
   "auth/weak-password":"Password কমপক্ষে 6 অক্ষর দিন",
   "auth/invalid-email":"Email ঠিকভাবে লিখুন"
  };

  msg.textContent=
   errors[e.code] ||
   "Login হয়নি: "+e.message;
 }
}


