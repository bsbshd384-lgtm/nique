 snap.forEach(c=>{

  const v=c.val();

  if(v.url){

   videos.unshift({
    id:c.key,
    title:v.title,
    channel:v.channel||"Unique Creator",
    category:"All",
    views:(v.views||0)+" views",
    time:"recent",
    duration:"",
    url:v.url,
    thumb:v.thumbnail||""
   });

  }

 });

 renderFeed();

}


